# /etc/systemd/journald.conf.d/alertavida.conf — installed by deploy/install.sh
# (issue #134). journald's default cap is 10 % of the filesystem up to 4 GiB;
# on the 64 GiB VM disk that is 4 GiB of logs for a service that writes a few
# MB a day. 500 MB keeps months of history; MaxRetentionSec bounds it by age
# as well, so an old journal never survives just because the box is quiet.
[Journal]
SystemMaxUse=500M
MaxRetentionSec=6month
